name: Build Kazhutha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kazhutha.apk

      - name: Upload Kazhutha APK
        uses: actions/upload-artifact@v7
        with:
          name: Kazhutha-APK
          path: Kazhutha.apk
          if-no-files-found: error
          retention-days: 30
